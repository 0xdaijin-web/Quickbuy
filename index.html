<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>QuickBuy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#ffffff);--tx:var(--tg-theme-text-color,#141414);--mu:var(--tg-theme-hint-color,#6b6b6b);--bt:var(--tg-theme-button-color,#2f7de1);--btx:var(--tg-theme-button-text-color,#ffffff);--bx:var(--tg-theme-secondary-bg-color,#f1f1f1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:28px 16px}
h1{font-size:19px;font-weight:600;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mu)}
.kotak{background:var(--bx);border-radius:10px;padding:10px 12px;margin:0 0 6px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;user-select:all;-webkit-user-select:all}
.label{font-size:13px;color:var(--mu);margin:14px 0 6px}
button,a.tombol{display:block;width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;background:var(--bt);color:var(--btx);text-align:center;text-decoration:none;cursor:pointer;margin-top:8px}
button.dua{background:var(--bx);color:var(--tx)}
.putar{width:28px;height:28px;border:3px solid var(--bx);border-top-color:var(--bt);border-radius:50%;animation:p .8s linear infinite;margin:0 0 14px}
@keyframes p{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="isi"><div class="putar"></div><h1>Membuka bot kamu…</h1></main>
<script>
const SALT = "e5ab14b246a15f27f5be76ca46ca45c4";
const DATA = {"89a754885acfd8e650f03255381ef23c834b0a5db31ef13fa9a9e437c2f5373d": "zNxtJMTw2qviNUlBPBbNKZV2wz+9YI45OROo0LWajOk2kQRR5HQ=", "b3e19786db367d5597cb270eca75d193deb20858d9737b684320faf263c11c5e": "Kx0lePq7iDTru6uEowttYajKb+eMMFjWy7PMvSyGbaLD1j265CRAfQ=="};
const isi = document.getElementById("isi");
const tg = window.Telegram && window.Telegram.WebApp;
async function sha(t) {
  return new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)));
}
function hex(u) { return Array.from(u, x => x.toString(16).padStart(2, "0")).join(""); }
async function bukaLink(uid, isiAcak) {
  const raw = Uint8Array.from(atob(isiAcak), c => c.charCodeAt(0));
  let ks = new Uint8Array(0);
  for (let i = 0; ks.length < raw.length; i++) {
    const h = await sha("key:" + SALT + ":" + uid + ":" + i);
    const n = new Uint8Array(ks.length + h.length); n.set(ks); n.set(h, ks.length); ks = n;
  }
  return new TextDecoder().decode(raw.map((b, j) => b ^ ks[j]));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function salin(teks, tombol) {
  const ok = () => { tombol.textContent = "Tersalin ✓"; setTimeout(() => tombol.textContent = tombol.dataset.t, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(teks).then(ok, () => { tombol.textContent = "Tekan lama teks di atas untuk menyalin"; });
  } else { tombol.textContent = "Tekan lama teks di atas untuk menyalin"; }
}
function tampil(html) { isi.innerHTML = html; }
function tombolSalin(id, teks, label) {
  const b = document.getElementById(id);
  if (b) { b.dataset.t = label; b.onclick = () => salin(teks, b); }
}
(async () => {
  try {
    if (tg) { tg.ready(); }
    const d = (tg && tg.initDataUnsafe) || {};
    const u = d.user;
    const ca = (d.start_param || new URLSearchParams(location.search).get("ca") || "").trim();
    if (!u) {
      return tampil("<h1>Buka lewat Telegram</h1><p>Halaman ini hanya bekerja lewat tombol QuickBuy di channel.</p>");
    }
    const caOk = /^0x[0-9a-fA-F]{40}$/.test(ca);
    const ct = DATA[hex(await sha("id:" + SALT + ":" + u.id))];
    if (!ct) {
      tampil("<h1>Akun kamu belum terdaftar</h1>"
        + "<p>Kirim ID Telegram ini ke admin channel supaya QuickBuy langsung membuka bot trading kamu.</p>"
        + "<div class='label'>ID Telegram kamu</div><div class='kotak'>" + esc(u.id) + "</div>"
        + "<button id='sid'>Salin ID</button>"
        + (caOk ? "<div class='label'>CA token (tempel di bot kamu)</div><div class='kotak'>" + esc(ca) + "</div>"
                + "<button id='sca' class='dua'>Salin CA</button>" : ""));
      tombolSalin("sid", String(u.id), "Salin ID");
      tombolSalin("sca", ca, "Salin CA");
      return;
    }
    if (!caOk) {
      return tampil("<h1>CA tidak valid</h1><p>Tombol ini tidak membawa alamat token yang benar.</p>");
    }
    const link = (await bukaLink(u.id, ct)).split("{token}").join(ca);
    if (!/^https:\/\/t\.me\//.test(link)) {
      return tampil("<h1>Link bot tidak valid</h1><p>Minta admin memeriksa daftar akun.</p>");
    }
    tampil("<div class='putar'></div><h1>Membuka bot kamu…</h1>"
      + "<p>Kalau tidak terbuka otomatis, tekan tombol di bawah.</p>"
      + "<a class='tombol' id='buka' href='" + esc(link) + "'>Buka bot</a>");
    document.getElementById("buka").onclick = (e) => { if (tg) { e.preventDefault(); tg.openTelegramLink(link); } };
    if (tg) {
      tg.openTelegramLink(link);
      setTimeout(() => { try { tg.close(); } catch (e) {} }, 600);
    }
  } catch (e) {
    tampil("<h1>Terjadi kesalahan</h1><p>" + esc(e && e.message || e) + "</p>");
  }
})();
</script>
</body>
</html>
